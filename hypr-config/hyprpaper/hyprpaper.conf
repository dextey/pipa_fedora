# hyprpaper — save as ~/.config/hypr/hyprpaper.conf
# Put a Catppuccin wallpaper at the path below (see install notes for how to fetch one).

preload = ~/.config/hypr/wallpaper.png
wallpaper = DSI-1,~/.config/hypr/wallpaper.png

# don't keep wallpapers in RAM after setting (saves memory on the tablet)
ipc = on
splash = false
