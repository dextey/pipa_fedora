# hypridle — save as ~/.config/hypr/hypridle.conf
# IMPORTANT for the pipa: this does NOT suspend, because mainline resume is slow.
# It locks and turns the screen off on idle, and wakes instantly on touch.

general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid duplicate locks
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 6 minutes (fast DPMS, not suspend)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# NOTE: intentionally NO suspend listener. Add one only once mainline
# suspend/resume on the pipa is reliable.
