# hypridle — save as ~/.config/hypr/hypridle.conf
# Keyboard-less tablet (pipa): NO hyprlock anywhere — the Wayland session-lock
# protocol blocks the on-screen keyboard, so a lock screen can't be unlocked.
# This ONLY turns the screen off on idle (fast DPMS, not suspend); touch wakes it.

general {
    # No lock_cmd, no before_sleep lock. Just make sure the display comes back
    # on after any sleep that does happen.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Screen off after 5 minutes of idle (DPMS, wakes instantly on touch).
listener {
    timeout    = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# NOTE: intentionally NO suspend listener and NO lock listener.
