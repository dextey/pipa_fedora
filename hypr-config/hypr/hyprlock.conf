# hyprlock — save as ~/.config/hypr/hyprlock.conf — Catppuccin Mocha

general {
    # Don't try to authenticate an empty password (avoids spurious fails).
    ignore_empty_input = true
}

auth {
    # No fingerprint reader on the pipa.
    fingerprint:enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
    blur_size = 5
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 320, 56
    position = 0, -40
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 12
    dots_size = 0.3
    dots_spacing = 0.3

    outer_color = rgb(cba6f7)
    inner_color = rgb(313244)
    font_color  = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color  = rgb(f38ba8)

    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    color = rgb(a6adc8)
    position = 0, 50
    halign = center
    valign = center
}
