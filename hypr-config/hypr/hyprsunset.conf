# hyprsunset — save as ~/.config/hypr/hyprsunset.conf
# Night-light scheduler. Started from autostart.lua (hl.exec_cmd("hyprsunset")).
# Daytime is left untouched (identity); evenings get a warm tint that's easier
# on the eyes for reading on the tablet.

# Daytime: no tint at all (without this, hyprsunset applies a default tint).
profile {
    time = 07:00
    identity = true
}

# Evening: warm 4000K from 20:00. Lower the number for a warmer screen.
profile {
    time = 20:00
    temperature = 4000
}
